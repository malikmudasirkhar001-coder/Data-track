<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudassir Zone | Premium Live CNIC Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <meta name="1902dca9dec5be85e1ad2e0dbc933621e76d8332" content="1902dca9dec5be85e1ad2e0dbc933621e76d8332" />
    <script>
    (function(yufn){
    var d = document,
        s = d.createElement('script'),
        l = d.scripts[d.scripts.length - 1];
    s.settings = yufn || {};
    s.src = "//surefootedpause.com/c.Dy9X6/bf2Q5YlHSIWZQp9KNpzyI/2UM/T_QDyLOYSq0E3jMIjHYmxKNCD/M-z-";
    s.async = true;
    s.referrerPolicy = 'no-referrer-when-downgrade';
    l.parentNode.insertBefore(s, l);
    })({})
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mudassir: { 400: '#ff66b2', 500: '#ec4899', 600: '#db2777' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #090a0f; }

        /* CENTERED & COMPACT AD FRAMES */
        .auto-top-video-frame, .auto-bottom-video-frame {
            position: fixed; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 85px;
            background: #000; border: 1px solid #ec4899; border-radius: 12px;
            z-index: 9999; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .auto-top-video-frame { top: 8px; }
        .auto-bottom-video-frame { bottom: 8px; }

        .auto-top-video-frame video, .auto-bottom-video-frame video {
            width: 100%; height: 100%; object-fit: cover;
        }

        .skip-btn {
            position: absolute; right: 8px; bottom: 8px;
            background: rgba(0, 0, 0, 0.85); color: #ec4899;
            border: 1px solid #ec4899; font-size: 10px; font-weight: bold;
            padding: 3px 8px; border-radius: 6px; cursor: pointer; z-index: 10000;
        }

        .middle-work-area {
            position: fixed; top: 100px; bottom: 100px; left: 0; right: 0;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col relative">

    <!-- TOP CENTERED VIDEO AD -->
    <div class="auto-top-video-frame" id="top_ad_container">
      <video id="top_video_player" autoplay muted playsinline></video>
      <button class="skip-btn hidden" id="top_skip_btn" onclick="skipAd('top_ad_container')">Skip Ad ✕</button>
    </div>

    <!-- MANDATORY LOGIN SCREEN (DEFAULT UNTIL AUTHENTICATED) -->
    <div id="auth-gatekeeper" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-mudassir-500 rounded-2xl p-6 max-w-md w-full relative shadow-[0_0_25px_rgba(236,72,153,0.3)]">
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto rounded-full bg-mudassir-600 flex items-center justify-center text-white text-2xl font-black mb-2">
                    M
                </div>
                <h3 class="text-xl font-mono font-bold text-mudassir-400">Mudassir Zone Authorization</h3>
                <p class="text-xs text-slate-400 font-mono mt-1">Authentication required to unlock trace nodes.</p>
            </div>

            <form id="gate-login-form" class="flex flex-col gap-3">
                <input type="email" id="gate-email" placeholder="Email Address" required class="bg-black border border-slate-700 p-3 rounded-lg text-sm text-white outline-none focus:border-mudassir-500 font-mono">
                <input type="password" id="gate-password" placeholder="Access Password" required class="bg-black border border-slate-700 p-3 rounded-lg text-sm text-white outline-none focus:border-mudassir-500 font-mono">
                <button type="submit" class="bg-mudassir-600 hover:bg-mudassir-500 text-white font-bold p-3 rounded-lg font-mono text-sm transition-all shadow-[0_0_15px_rgba(236,72,153,0.4)]">
                    AUTHENTICATE ACCESS
                </button>
            </form>

            <div class="mt-6 text-center border-t border-slate-800 pt-4">
                <a href="https://wa.me/923084191378?text=Hello%20Mudassir%20I%20Want%20Access%20Key" target="_blank" class="text-xs text-green-400 font-mono hover:underline flex items-center justify-center gap-1">
                    <i class="bi bi-whatsapp"></i> Request Access Key from Mudassir (0308 91 378)
                </a>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT (LOCKED UNTIL LOGIN) -->
    <div class="middle-work-area hidden" id="main-app-content">
        <div id="toast-container" class="fixed bottom-24 right-4 z-50 flex flex-col gap-3 pointer-events-none"></div>

        <nav class="sticky top-0 z-40 bg-slate-900/90 glass-card border-b border-mudassir-500/30">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-mudassir-600 flex items-center justify-center text-white text-lg font-black">
                        M
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-mudassir-400">Mudassir Zone</h1>
                        <p class="text-[9px] text-slate-400 font-mono uppercase">Identity Resolution Terminal</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="admin-btn" onclick="openAdminModal()" class="hidden px-3 py-1.5 bg-pink-700 hover:bg-pink-600 text-white rounded-full font-bold text-xs font-mono">
                        <i class="bi bi-shield-lock"></i> ADMIN
                    </button>
                    <button onclick="logout()" class="px-3 py-1.5 bg-slate-800 hover:bg-red-600 text-white rounded-full font-bold text-xs font-mono">
                        LOGOUT
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
            <section class="flex flex-col gap-6">
                <div class="bg-slate-900 border border-mudassir-500/40 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-xl font-bold mb-2 font-mono flex items-center gap-2 text-mudassir-400">
                        <i class="bi bi-terminal"></i> Initialize Target Trace
                    </h2>
                    
                    <form id="lookup-form" class="flex flex-col gap-4">
                        <div class="relative">
                            <i class="bi bi-cpu-fill absolute left-4 top-1/2 -translate-y-1/2 text-mudassir-500"></i>
                            <input type="text" id="lookup-input" required placeholder="Enter Mobile MSISDN or CNIC" class="w-full bg-black border border-slate-700 text-mudassir-400 rounded-xl pl-12 pr-4 py-3 focus:ring-2 focus:ring-mudassir-500 outline-none text-base font-mono">
                        </div>
                        <button type="submit" class="w-full bg-mudassir-600 hover:bg-mudassir-500 text-white font-extrabold py-3 rounded-xl shadow-lg font-mono">
                            EXECUTE QUERY
                        </button>
                    </form>
                </div>

                <div id="results-container" class="hidden"></div>
            </section>
        </main>
    </div>

    <!-- BOTTOM CENTERED VIDEO AD -->
    <div class="auto-bottom-video-frame" id="bottom_ad_container">
      <video id="bottom_video_player" autoplay muted playsinline></video>
      <button class="skip-btn hidden" id="bottom_skip_btn" onclick="skipAd('bottom_ad_container')">Skip Ad ✕</button>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4">
        <div class="bg-slate-900 border border-mudassir-500 rounded-2xl p-6 max-w-2xl w-full max-h-[85vh] overflow-y-auto relative">
            <span onclick="closeModal('admin-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl cursor-pointer">✕</span>
            <h3 class="text-lg font-mono font-bold text-mudassir-400 mb-4"><i class="bi bi-shield-lock"></i> Master Admin Controls</h3>
            
            <div class="bg-black/50 p-4 rounded-xl border border-slate-800 mb-6">
                <h4 class="text-xs font-mono text-mudassir-400 mb-2 font-bold">Create User Account</h4>
                <form id="create-user-form" class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input type="email" id="new-user-email" placeholder="User Email" required class="bg-slate-900 border border-slate-700 p-2 text-xs rounded text-white">
                    <input type="text" id="new-user-pass" placeholder="Assign Password" required class="bg-slate-900 border border-slate-700 p-2 text-xs rounded text-white">
                    <input type="number" id="new-user-days" placeholder="Days" required class="bg-slate-900 border border-slate-700 p-2 text-xs rounded text-white">
                    <button type="submit" class="md:col-span-3 bg-mudassir-600 text-white font-mono text-xs font-bold p-2 rounded">PROVISION ACCESS</button>
                </form>
            </div>

            <h4 class="text-xs font-mono text-white mb-2 font-bold">Registered Access Nodes</h4>
            <div id="admin-users-table" class="mb-6 overflow-x-auto text-xs"></div>

            <h4 class="text-xs font-mono text-white mb-2 font-bold">User Trace Audit Logs</h4>
            <div id="admin-logs-table" class="overflow-x-auto text-xs"></div>
        </div>
    </div>

    <script>
        const VAST_AD_URL = "https://surefootedpause.com/dGmsFnzTd.GYNpvTZ/GSUh/EeIm/9bu/Z/UTlLkGPVTHcPyhNwjIEQ1/M/TBc/t/NDztIP2/METwURyIM/SiZUsOaUWH1kppdwDT0_xD";
        let adPlayCount = 0;

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2 rounded-lg font-mono text-xs text-white ${isError ? 'bg-red-600' : 'bg-mudassir-600'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

        // GATEKEEPER LOGIN
        document.getElementById('gate-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('gate-email').value;
            const password = document.getElementById('gate-password').value;

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('auth-gatekeeper').classList.add('hidden');
                document.getElementById('main-app-content').classList.remove('hidden');
                if (data.role === 'admin') {
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
                showToast('Access Unlocked');
            } else {
                showToast(data.message, true);
            }
        });

        async function logout() {
            await fetch('/api/auth/logout', {method: 'POST'});
            location.reload();
        }

        // SMART AD PLAYER WITH SKIP MECHANIC
        async function loadVASTVideo(videoId, skipBtnId) {
            try {
                const response = await fetch(VAST_AD_URL);
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const mediaFiles = xmlDoc.getElementsByTagName("MediaFile");
                if (mediaFiles.length > 0) {
                    const videoSrc = mediaFiles[0].textContent.trim();
                    const player = document.getElementById(videoId);
                    const skipBtn = document.getElementById(skipBtnId);

                    if (player) {
                        player.src = videoSrc;
                        player.play();

                        player.onended = function() {
                            adPlayCount++;
                            if (adPlayCount >= 1 && skipBtn) {
                                skipBtn.classList.remove('hidden');
                            }
                        };
                    }
                }
            } catch (e) {}
        }

        function skipAd(containerId) {
            document.getElementById(containerId).style.display = 'none';
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadVASTVideo("top_video_player", "top_skip_btn");
            loadVASTVideo("bottom_video_player", "bottom_skip_btn");
        });

        // SEARCH & ADMIN HANDLERS
        document.getElementById('lookup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const container = document.getElementById('results-container');
            const num = document.getElementById('lookup-input').value.replace(/[^0-9]/g, '');

            container.classList.remove('hidden');
            container.innerHTML = `<div class="p-4 text-center text-mudassir-400 font-mono text-xs">SEARCHING DATABASE...</div>`;

            const res = await fetch(`/api/protected/trace?q=${num}`);
            const data = await res.json();
            if (res.ok && data.success && data.data?.records?.length > 0) {
                let rec = data.data.records[0];
                container.innerHTML = `
                    <div class="bg-black border border-mudassir-500 p-4 rounded-xl font-mono text-xs text-white">
                        <p class="text-mudassir-400 font-bold mb-2">TARGET RESOLVED</p>
                        <p>MSISDN: ${rec.phone || 'N/A'}</p>
                        <p>NAME: ${rec.full_name || 'N/A'}</p>
                        <p>CNIC: ${rec.cnic || 'N/A'}</p>
                        <p>ADDRESS: ${rec.address || 'N/A'}</p>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="bg-red-950 p-4 rounded-xl text-center text-red-400 font-mono text-xs">DATA NOT FOUND</div>`;
            }
        });

        function openAdminModal() {
            openModal('admin-modal');
            loadAdminUsers();
            loadAdminLogs();
        }

        async function loadAdminUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            if (data.success) {
                let html = `<table class="w-full text-left border-collapse">
                    <tr class="border-b border-slate-700 text-mudassir-400"><th>Email</th><th>Pass</th><th>Expiry</th><th>Action</th></tr>`;
                data.users.forEach(u => {
                    html += `<tr class="border-b border-slate-800">
                        <td>${u.email}</td><td class="text-pink-400 font-bold">${u.password}</td><td>${u.expiry_date}</td>
                        <td><button onclick="deleteUser(${u.id})" class="text-red-400 font-bold">Delete</button></td>
                    </tr>`;
                });
                html += `</table>`;
                document.getElementById('admin-users-table').innerHTML = html;
            }
        }

        async function loadAdminLogs() {
            const res = await fetch('/api/admin/trace_logs');
            const data = await res.json();
            if (data.success) {
                let html = `<table class="w-full text-left border-collapse">
                    <tr class="border-b border-slate-700 text-mudassir-400"><th>User</th><th>Target</th><th>Time</th></tr>`;
                data.logs.forEach(l => {
                    html += `<tr class="border-b border-slate-800">
                        <td>${l.user}</td><td class="text-mudassir-400 font-bold">${l.target}</td><td>${l.time}</td>
                    </tr>`;
                });
                html += `</table>`;
                document.getElementById('admin-logs-table').innerHTML = html;
            }
        }

        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('new-user-email').value;
            const password = document.getElementById('new-user-pass').value;
            const days = document.getElementById('new-user-days').value;

            const res = await fetch('/api/admin/users/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password, days})
            });
            const data = await res.json();
            if (data.success) { loadAdminUsers(); showToast("User Provisioned"); }
        });

        async function deleteUser(id) {
            await fetch(`/api/admin/users/delete/${id}`, {method: 'DELETE'});
            loadAdminUsers();
        }
    </script>
</body>
</html>
